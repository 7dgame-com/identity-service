name: CI/CD

on:
  push:
    branches: [main, develop, publish]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: Publish only candidate-<full SHA> after all release gates pass
        type: boolean
        required: false
        default: false
      publish_executor:
        description: Publish only a run-scoped immutable migration executor after all release gates pass
        type: boolean
        required: false
        default: false

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  IMAGE_NAME: gdgeek/identity-service
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Run tests
        run: npm test

      - name: Generate Develop completion regression evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: >-
          npm run iam:organization-write:develop-regression --
          --expected-revision=${{ github.sha }}
          --output=${{ github.workspace }}/identity-develop-regression.json

      - name: Retain Develop completion regression evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: identity-develop-regression-evidence
          path: identity-develop-regression.json
          if-no-files-found: error
          retention-days: 30

      - name: Build TypeScript
        run: npm run build

      - name: Validate immutable build revision input
        run: npm run build:compiled-revision -- --check "${{ github.sha }}"

      - name: Validate Docker Compose
        run: docker compose --profile identity config --quiet

  mysql-integration:
    name: MySQL Integration
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: identity_test_root_password
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: xrugc_identity_test
          MYSQL_USER: identity_test
          MYSQL_PASSWORD: identity_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pidentity_test_root_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run write-ledger MySQL integration tests
        env:
          NODE_ENV: test
          IDENTITY_TEST_MYSQL: "1"
          IDENTITY_DB_HOST: 127.0.0.1
          IDENTITY_DB_PORT: "3306"
          IDENTITY_DB_NAME: xrugc_identity_test
          IDENTITY_DB_USER: identity_test
          IDENTITY_DB_PASSWORD: identity_test_password
        run: npm test -- apps/identity-adapter/test/plugin-user-write-operation.mysql.spec.ts apps/identity-adapter/test/iam-organization-write.mysql.spec.ts

      - name: Run independent authority and migration integration tests
        env:
          NODE_ENV: test
          TZ: Asia/Shanghai
          IDENTITY_TEST_MYSQL: "1"
          IDENTITY_DB_HOST: 127.0.0.1
          IDENTITY_DB_PORT: "3306"
          # These fixtures create and drop random, isolated databases on this
          # ephemeral CI service. Never use a production principal here.
          IDENTITY_DB_USER: root
          IDENTITY_DB_PASSWORD: identity_test_root_password
          IDENTITY_TEST_MYSQL_PORT: "3306"
          IDENTITY_TEST_MYSQL_USER: root
          IDENTITY_TEST_MYSQL_PASSWORD: identity_test_root_password
        run: >-
          npm test -- --maxWorkers=1 --no-file-parallelism
          apps/identity-adapter/test/identity-allocator-attacks.mysql.spec.ts
          apps/identity-adapter/test/identity-explicit-activation.mysql.spec.ts
          apps/identity-adapter/test/identity-admission.mysql.spec.ts
          apps/identity-adapter/test/identity-migration-entry.mysql.spec.ts
          apps/identity-adapter/test/identity-owned-executor.mysql.spec.ts
          apps/identity-adapter/test/identity-source-fingerprint.mysql.spec.ts
          apps/identity-adapter/test/identity-accounts.mysql.spec.ts
          apps/identity-adapter/test/identity-runtime.mysql.spec.ts
          apps/identity-adapter/test/identity-http-bootstrap.mysql.spec.ts
          apps/identity-adapter/test/identity-account-sync.mysql.spec.ts
          apps/identity-adapter/test/identity-profile-migration.mysql.spec.ts
          apps/identity-adapter/test/identity-yii3.mysql.spec.ts
          apps/identity-adapter/test/apple-identity.mysql.spec.ts
          apps/identity-adapter/test/legacy-session-import.mysql.spec.ts
          apps/identity-adapter/test/legacy-refresh-credential.mysql.spec.ts
          apps/identity-adapter/test/legacy-refresh-graph.mysql.spec.ts
          apps/identity-adapter/test/legacy-wechat-signup.mysql.spec.ts
          apps/identity-adapter/test/legacy-challenge-import.mysql.spec.ts
          apps/identity-adapter/test/legacy-qrcode-import.mysql.spec.ts
          apps/identity-adapter/test/native-qrcode-mysql.spec.ts
          apps/identity-adapter/test/wechat-binding.mysql.spec.ts
          apps/identity-adapter/test/identity-yii-wechat-import.mysql.spec.ts
          apps/identity-adapter/test/legacy-admin.mysql.spec.ts
          apps/identity-adapter/test/device-sn-native.mysql.spec.ts
          apps/identity-adapter/test/organization-login-events-native.mysql.spec.ts
          apps/identity-adapter/test/oidc-native-session.mysql.spec.ts

      - name: Run organization login events MySQL integration tests
        env:
          NODE_ENV: test
          TZ: Asia/Shanghai
          LOGIN_EVENTS_MYSQL_TEST_PORT: "3306"
          LOGIN_EVENTS_MYSQL_TEST_PASSWORD: identity_test_root_password
        run: npm test -- apps/identity-adapter/test/organization-login-events.mysql.spec.ts

      - name: Run device SN MySQL integration tests
        env:
          NODE_ENV: test
          TZ: Asia/Shanghai
          DEVICE_SN_MYSQL_TEST_PORT: "3306"
          DEVICE_SN_MYSQL_TEST_PASSWORD: identity_test_root_password
        run: npm test -- apps/identity-adapter/test/device-sn-sessions.mysql.spec.ts

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, mysql-integration]
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/publish')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_candidate == true)

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TENCENT_REGISTRY_USER || secrets.TENCENT_REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/publish' }}
            type=raw,value=candidate-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.publish_candidate == true }}

      - name: Verify candidate cannot update floating tags
        if: github.event_name == 'workflow_dispatch' && inputs.publish_candidate == true
        env:
          CANDIDATE_TAGS: ${{ steps.meta.outputs.tags }}
          CANDIDATE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: >-
          node -e '
          const tags = (process.env.CANDIDATE_TAGS ?? "").split(/\r?\n/).map(x => x.trim()).filter(Boolean);
          const sha = process.env.CANDIDATE_SHA;
          const expected = `${process.env.CANDIDATE_REPOSITORY}:candidate-${sha}`;
          if (!/^[a-f0-9]{40}$/.test(sha ?? "") || tags.length !== 1 || tags[0] !== expected) {
            console.error("Candidate publication must contain exactly its immutable SHA tag."); process.exit(2);
          }
          '

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable Develop image provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GIT_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: >-
          node -e '
          const fs = require("node:fs");
          const sha = process.env.GIT_SHA;
          const digest = process.env.IMAGE_DIGEST;
          const repository = process.env.IMAGE_REPOSITORY;
          if (!/^[a-f0-9]{40}$/.test(sha ?? "") || !/^sha256:[a-f0-9]{64}$/.test(digest ?? "") ||
              !/^[A-Za-z0-9._:/-]+$/.test(repository ?? "")) process.exit(2);
          const artifact = {contract:"identity-service/develop-image-provenance/v1",gitSha:sha,
            image:`${repository}@${digest}`,imageDigest:digest};
          fs.writeFileSync("identity-develop-image-provenance.json", `${JSON.stringify(artifact)}\n`, {encoding:"utf8",flag:"wx",mode:0o600});
          '

      - name: Retain immutable Develop image provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: identity-develop-image-provenance-${{ github.sha }}
          path: identity-develop-image-provenance.json
          if-no-files-found: error
          retention-days: 30

      - name: Record immutable candidate image provenance
        if: github.event_name == 'workflow_dispatch' && inputs.publish_candidate == true
        env:
          GIT_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: >-
          node -e '
          const fs = require("node:fs");
          const sha = process.env.GIT_SHA;
          const digest = process.env.IMAGE_DIGEST;
          const repository = process.env.IMAGE_REPOSITORY;
          if (!/^[a-f0-9]{40}$/.test(sha ?? "") || !/^sha256:[a-f0-9]{64}$/.test(digest ?? "") ||
              !/^[A-Za-z0-9._:/-]+$/.test(repository ?? "")) process.exit(2);
          const artifact = {contract:"identity-service/candidate-image-provenance/v1",gitSha:sha,
            image:`${repository}@${digest}`,imageDigest:digest,tag:`candidate-${sha}`,platform:"linux/amd64"};
          fs.writeFileSync("identity-candidate-image-provenance.json", `${JSON.stringify(artifact)}\n`, {encoding:"utf8",flag:"wx",mode:0o600});
          '

      - name: Retain immutable candidate image provenance
        if: github.event_name == 'workflow_dispatch' && inputs.publish_candidate == true
        uses: actions/upload-artifact@v4
        with:
          name: identity-candidate-image-provenance-${{ github.sha }}
          path: identity-candidate-image-provenance.json
          if-no-files-found: error
          retention-days: 30

  build-executor:
    name: Build & Verify Private Migration Executor
    runs-on: ubuntu-latest
    needs: [test, mysql-integration]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_executor == true

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to existing Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TENCENT_REGISTRY_USER || secrets.TENCENT_REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      - name: Fix one immutable run-scoped executor tag
        id: executor-tag
        env:
          EXECUTOR_REPOSITORY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          EXECUTOR_SOURCE_SHA: ${{ github.sha }}
          EXECUTOR_RUN_ID: ${{ github.run_id }}
          EXECUTOR_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          node -e '
          const fs=require("node:fs");
          const {EXECUTOR_REPOSITORY:r,EXECUTOR_SOURCE_SHA:s,EXECUTOR_RUN_ID:i,EXECUTOR_RUN_ATTEMPT:a}=process.env;
          if(!/^[A-Za-z0-9._:/-]+$/.test(r??"")||!/^[a-f0-9]{40}$/.test(s??"")||!/^\d+$/.test(i??"")||!/^\d+$/.test(a??""))process.exit(2);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`tag=${r}:executor-${s}-${i}-${a}\n`);
          '

      - name: Build and push only the dedicated executor target
        id: executor-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: migration-executor
          push: true
          platforms: linux/amd64
          tags: ${{ steps.executor-tag.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            io.xrugc.identity.stage=migration-executor
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=identity-migration-executor
          cache-to: type=gha,scope=identity-migration-executor,mode=max

      - name: Pull the exact published executor digest
        env:
          EXECUTOR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.executor-build.outputs.digest }}
        run: docker pull "${EXECUTOR_IMAGE}"

      - name: Verify actual immutable runtime layout without network or credentials
        env:
          EXECUTOR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.executor-build.outputs.digest }}
        run: docker run --rm --network=none --read-only --entrypoint=node "${EXECUTOR_IMAGE}" scripts/verify-identity-finalization-runtime.mjs --executor > identity-executor-layout-validation.json

      - name: Read public revision and file hashes from the exact image
        env:
          EXECUTOR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.executor-build.outputs.digest }}
        run: >-
          docker run --rm --network=none --read-only --entrypoint=node "${EXECUTOR_IMAGE}" --input-type=module -e '
          import fs from "node:fs";import {createHash} from "node:crypto";
          import {ORGANIZATION_RECONCILIATION_COMPILED_BUILD_REVISION as compiledRevision} from "./dist/apps/identity-adapter/src/generated/iam-organization-reconciliation-compiled-revision.js";
          const sha=p=>createHash("sha256").update(fs.readFileSync(p)).digest("hex");
          const entries=["account-sync","allocator-highwater","identity-activate","identity-owned-executor"];
          const vendor=["migration-artifacts.mjs","migration-plan.mjs"];
          console.log(JSON.stringify({gitCommit:fs.readFileSync("GIT_COMMIT","utf8").trim(),compiledRevision,
            entrySha256:Object.fromEntries(entries.map(n=>[n,sha(`dist/scripts/${n}.js`)])),
            vendorSha256:Object.fromEntries(vendor.map(n=>[n,sha(`dist/packages/identity-finalization-runtime/${n}`)]))}));
          ' > identity-executor-runtime-metadata.json

      - name: Read image configuration from the exact digest
        env:
          EXECUTOR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.executor-build.outputs.digest }}
        run: docker image inspect "${EXECUTOR_IMAGE}" --format '{{json .Config}}' > identity-executor-image-config.json

      - name: Record separate immutable executor provenance
        env:
          EXECUTOR_SOURCE_SHA: ${{ github.sha }}
          EXECUTOR_IMAGE_DIGEST: ${{ steps.executor-build.outputs.digest }}
          EXECUTOR_REPOSITORY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          EXECUTOR_TAG: ${{ steps.executor-tag.outputs.tag }}
          EXECUTOR_RUN_ID: ${{ github.run_id }}
          EXECUTOR_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          node -e '
          const fs=require("node:fs");
          const {EXECUTOR_SOURCE_SHA:s,EXECUTOR_IMAGE_DIGEST:d,EXECUTOR_REPOSITORY:r,EXECUTOR_TAG:t,EXECUTOR_RUN_ID:i,EXECUTOR_RUN_ATTEMPT:a}=process.env;
          const read=p=>JSON.parse(fs.readFileSync(p,"utf8"));
          const layout=read("identity-executor-layout-validation.json"),runtime=read("identity-executor-runtime-metadata.json"),config=read("identity-executor-image-config.json"),adapter=read("packages/identity-finalization-runtime/upstream-manifest.json");
          if(!/^[a-f0-9]{40}$/.test(s??"")||!/^sha256:[a-f0-9]{64}$/.test(d??"")||!/^[A-Za-z0-9._:/-]+$/.test(r??"")||!/^\d+$/.test(i??"")||!/^\d+$/.test(a??"")||t!==`${r}:executor-${s}-${i}-${a}`)process.exit(2);
          if(layout.verified!==true||layout.executorLayout!==true||layout.upstreamCommit!==adapter.upstreamCommit||runtime.gitCommit!==s||runtime.compiledRevision!==s||config.User!=="node"||config.WorkingDir!=="/opt/xrugc/identity"||JSON.stringify(config.Entrypoint)!==JSON.stringify(["node","dist/scripts/identity-owned-executor.js"])||(config.Cmd!==null&&JSON.stringify(config.Cmd)!=="[]")||config.Labels?.["org.opencontainers.image.revision"]!==s||config.Labels?.["io.xrugc.identity.stage"]!=="migration-executor")process.exit(2);
          if(Object.keys(runtime.entrySha256??{}).sort().join(",")!=="account-sync,allocator-highwater,identity-activate,identity-owned-executor"||Object.values(runtime.entrySha256).some(h=>!/^[a-f0-9]{64}$/.test(h))||Object.keys(runtime.vendorSha256??{}).sort().join(",")!=="migration-artifacts.mjs,migration-plan.mjs"||adapter.files.some(f=>runtime.vendorSha256[f.path]!==f.sha256))process.exit(2);
          const artifact={contract:"identity-service/executor-image-provenance/v1",stage:"migration-executor",sourceGitSha:s,gitSha:s,image:`${r}@${d}`,imageDigest:d,tag:t,platform:"linux/amd64",compiledRevision:runtime.compiledRevision,gitCommit:runtime.gitCommit,
            entrySha256:runtime.entrySha256,adapter:{upstreamCommit:adapter.upstreamCommit,sourceFiles:adapter.files,runtimeSha256:runtime.vendorSha256},runtimeLayoutVerified:true,
            imageConfig:{user:config.User,workingDir:config.WorkingDir,entrypoint:config.Entrypoint,cmd:config.Cmd,ociRevision:config.Labels["org.opencontainers.image.revision"],stageLabel:config.Labels["io.xrugc.identity.stage"]},workflowRunId:i,workflowRunAttempt:a};
          fs.writeFileSync("identity-executor-image-provenance.json",JSON.stringify(artifact)+"\n",{encoding:"utf8",flag:"wx",mode:0o600});
          '

      - name: Retain dedicated executor provenance
        uses: actions/upload-artifact@v4
        with:
          name: identity-executor-image-provenance-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: identity-executor-image-provenance.json
          if-no-files-found: error
          retention-days: 30
