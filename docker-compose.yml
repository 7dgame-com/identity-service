services:
  identity-mysql:
    image: mysql:8.4
    command: --sql-mode="NO_ENGINE_SUBSTITUTION"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${IDENTITY_DB_NAME:-xrugc_identity}
      MYSQL_USER: ${IDENTITY_DB_USER:-identity}
      MYSQL_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_password}
    ports:
      - "127.0.0.1:3317:3306"
    volumes:
      - identity_mysql_data:/var/lib/mysql
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 8

  identity-redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6387:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    profiles: ["identity"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://identity-mysql:3306/${KEYCLOAK_DB_NAME:-xrugc_keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_password}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:8087:8080"
    volumes:
      - ./deploy/keycloak/realm-readonly.json:/opt/keycloak/data/import/realm-readonly.json:ro
    depends_on:
      identity-mysql:
        condition: service_healthy

  identity-adapter:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: ["identity"]
    environment:
      PORT: 8086
      IDENTITY_READONLY_MODE: "true"
      IDENTITY_CORS_ORIGINS: ${IDENTITY_CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3004,http://localhost:3005,http://localhost:3008}
      LEGACY_DB_HOST: ${LEGACY_DB_HOST:-host.docker.internal}
      LEGACY_DB_PORT: ${LEGACY_DB_PORT:-3306}
      LEGACY_DB_NAME: ${LEGACY_DB_NAME:-bujiaban}
      LEGACY_DB_USER: ${LEGACY_DB_USER:-bujiaban}
      LEGACY_DB_PASSWORD: ${LEGACY_DB_PASSWORD:-testpassword}
      PLUGIN_DB_HOST: ${PLUGIN_DB_HOST:-}
      PLUGIN_DB_PORT: ${PLUGIN_DB_PORT:-3306}
      PLUGIN_DB_NAME: ${PLUGIN_DB_NAME:-}
      PLUGIN_DB_USER: ${PLUGIN_DB_USER:-}
      PLUGIN_DB_PASSWORD: ${PLUGIN_DB_PASSWORD:-}
      IDENTITY_IAM_ORG_RECONCILIATION_LEGACY_DB_USER: ${IDENTITY_IAM_ORG_RECONCILIATION_LEGACY_DB_USER:-}
      IDENTITY_IAM_ORG_RECONCILIATION_LEGACY_DB_PASSWORD: ${IDENTITY_IAM_ORG_RECONCILIATION_LEGACY_DB_PASSWORD:-}
      IDENTITY_IAM_ORG_RECONCILIATION_IDENTITY_DB_USER: ${IDENTITY_IAM_ORG_RECONCILIATION_IDENTITY_DB_USER:-}
      IDENTITY_IAM_ORG_RECONCILIATION_IDENTITY_DB_PASSWORD: ${IDENTITY_IAM_ORG_RECONCILIATION_IDENTITY_DB_PASSWORD:-}
      IDENTITY_DB_HOST: identity-mysql
      IDENTITY_DB_PORT: 3306
      IDENTITY_DB_NAME: ${IDENTITY_DB_NAME:-xrugc_identity}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:-identity}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_password}
      IDENTITY_LOGIN_AUDIT_ENABLED: ${IDENTITY_LOGIN_AUDIT_ENABLED:-false}
      IDENTITY_INTERNAL_API_TOKEN: ${IDENTITY_INTERNAL_API_TOKEN:-}
      IDENTITY_LOGIN_AUDIT_HASH_SALT: ${IDENTITY_LOGIN_AUDIT_HASH_SALT:-xrugc-login-audit-v1}
      IDENTITY_IAM_ORG_WRITE_MODE: ${IDENTITY_IAM_ORG_WRITE_MODE:-disabled}
      IDENTITY_IAM_ORG_WRITE_ROUTE_INTEGRATION_ENABLED: ${IDENTITY_IAM_ORG_WRITE_ROUTE_INTEGRATION_ENABLED:-false}
      IDENTITY_IAM_ORG_WRITE_DUAL_WRITE_EXECUTION_ENABLED: ${IDENTITY_IAM_ORG_WRITE_DUAL_WRITE_EXECUTION_ENABLED:-false}
      IDENTITY_IAM_ORG_WRITE_ROLLOUT_MODE: ${IDENTITY_IAM_ORG_WRITE_ROLLOUT_MODE:-off}
      IDENTITY_IAM_ORG_WRITE_ROLLOUT_ALLOWLIST: ${IDENTITY_IAM_ORG_WRITE_ROLLOUT_ALLOWLIST:-}
      IDENTITY_IAM_ORG_WRITE_ROLLOUT_PERCENTAGE: ${IDENTITY_IAM_ORG_WRITE_ROLLOUT_PERCENTAGE:-0}
      IDENTITY_IAM_ORG_WRITE_CANDIDATE_MATERIALIZATION_ENABLED: ${IDENTITY_IAM_ORG_WRITE_CANDIDATE_MATERIALIZATION_ENABLED:-false}
      IDENTITY_IAM_ORG_WRITE_CANDIDATE_MATERIALIZATION_TARGET_LEGACY_USER_ID: ${IDENTITY_IAM_ORG_WRITE_CANDIDATE_MATERIALIZATION_TARGET_LEGACY_USER_ID:-0}
      IDENTITY_IAM_ORG_WRITE_CANDIDATE_BATCH_MATERIALIZATION_ENABLED: ${IDENTITY_IAM_ORG_WRITE_CANDIDATE_BATCH_MATERIALIZATION_ENABLED:-false}
      IDENTITY_IAM_ORG_WRITE_CANDIDATE_BATCH_MATERIALIZATION_ENVIRONMENT: ${IDENTITY_IAM_ORG_WRITE_CANDIDATE_BATCH_MATERIALIZATION_ENVIRONMENT:-disabled}
      IDENTITY_IAM_ORG_WRITE_CANDIDATE_BATCH_MATERIALIZATION_PLAN_HMAC_KEY: ${IDENTITY_IAM_ORG_WRITE_CANDIDATE_BATCH_MATERIALIZATION_PLAN_HMAC_KEY:-}
      IDENTITY_IAM_ORG_WRITE_CANDIDATE_BATCH_EXPECTED_LEGACY_SUBJECT_COUNT: ${IDENTITY_IAM_ORG_WRITE_CANDIDATE_BATCH_EXPECTED_LEGACY_SUBJECT_COUNT:-0}
      IDENTITY_IAM_ORG_WRITE_CANDIDATE_BATCH_EXPECTED_PROTECTED_SUBJECT_COUNT: ${IDENTITY_IAM_ORG_WRITE_CANDIDATE_BATCH_EXPECTED_PROTECTED_SUBJECT_COUNT:-0}
      IDENTITY_IAM_ORG_WRITE_RECOVERY_DRILL_ENABLED: ${IDENTITY_IAM_ORG_WRITE_RECOVERY_DRILL_ENABLED:-false}
      IDENTITY_IAM_ORG_WRITE_RECOVERY_DRILL_TARGET_LEGACY_USER_ID: ${IDENTITY_IAM_ORG_WRITE_RECOVERY_DRILL_TARGET_LEGACY_USER_ID:-0}
      IDENTITY_TOKEN_ISSUANCE_ENABLED: ${IDENTITY_TOKEN_ISSUANCE_ENABLED:-false}
      IDENTITY_JWT_PRIVATE_KEY_PEM: ${IDENTITY_JWT_PRIVATE_KEY_PEM:-}
      IDENTITY_JWT_PRIVATE_KEY_FILE: ${IDENTITY_JWT_PRIVATE_KEY_FILE:-}
      IDENTITY_JWT_PUBLIC_KEY_PEM: ${IDENTITY_JWT_PUBLIC_KEY_PEM:-}
      IDENTITY_JWT_PUBLIC_KEY_FILE: ${IDENTITY_JWT_PUBLIC_KEY_FILE:-}
      IDENTITY_JWT_KEY_ID: ${IDENTITY_JWT_KEY_ID:-identity-stage4}
      IDENTITY_JWT_ISSUER: ${IDENTITY_JWT_ISSUER:-identity-service}
      IDENTITY_JWT_AUDIENCE: ${IDENTITY_JWT_AUDIENCE:-xrugc-api}
      IDENTITY_ACCESS_TOKEN_TTL_SECONDS: ${IDENTITY_ACCESS_TOKEN_TTL_SECONDS:-10800}
      IDENTITY_REFRESH_TOKEN_TTL_SECONDS: ${IDENTITY_REFRESH_TOKEN_TTL_SECONDS:-604800}
      KEYCLOAK_BASE_URL: http://keycloak:8080
      REDIS_URL: redis://identity-redis:6379/1
      JWKS_PUBLIC_KEYS_JSON: '${JWKS_PUBLIC_KEYS_JSON:-{"keys":[]}}'
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-identity-adapter}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${OTEL_EXPORTER_OTLP_TRACES_HEADERS:-}
    ports:
      - "127.0.0.1:8086:8086"
    depends_on:
      identity-redis:
        condition: service_healthy
      identity-mysql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  identity_mysql_data:
